<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   PALABRAS  —  AQUÍ SE AÑADEN LAS PALABRAS NUEVAS CADA SEMANA
   ---------------------------------------------------------------------
   · semana:    número del vocabulario (1, 2, 3…). Al abrir el archivo
                sale siempre el último; en el desplegable se eligen los demás.
   · palabra:   escribe entre [corchetes] las letras difíciles; saldrán
                en rojo y más grandes. Ej.: "[h]ip[é]r[b]ole"
   · pista:     nota ortográfica breve (aparece a mano, en rojo).
   · icono:     nombre de un icono de la biblioteca (ver ICONOS más abajo)
                o un emoji, p. ej. "🦉". Si lo dejas vacío, sale un libro.
   · Las diapositivas se generan solas, de tres en tres.
   ===================================================================== */
const PALABRAS = [
  // ---------- VOCABULARIO 1 ----------
  { semana: 1, palabra: "perspica[z]", pista: "z final → plural perspicaces",
    significado: "Que tiene agudeza e ingenio para comprender las cosas con rapidez.",
    sinonimos: ["agudo", "sagaz"], icono: "ojo" },
  { semana: 1, palabra: "[h]ip[é]r[b]ole", pista: "h inicial, b y tilde (esdrújula)",
    significado: "Figura retórica que consiste en exagerar aquello de lo que se habla.",
    sinonimos: ["exageración", "ponderación"], icono: "megafono" },
  { semana: 1, palabra: "desa[h]o[g]o", pista: "h intercalada: des + ahogo",
    significado: "Alivio de una pena, un trabajo o una necesidad.",
    sinonimos: ["alivio", "descanso"], icono: "suspiro" },
  { semana: 1, palabra: "ad[v]er[b]io", pista: "primero v, después b",
    significado: "Categoría gramatical que modifica el significado del verbo, del adjetivo o de otro adverbio.",
    sinonimos: ["modificador", "partícula"], icono: "etiqueta" },
  { semana: 1, palabra: "in[h][ó]spito", pista: "h intercalada y tilde (esdrújula)",
    significado: "Que no ofrece condiciones agradables o de seguridad para vivir.",
    sinonimos: ["hostil", "inhabitable"], icono: "desierto" },
  { semana: 1, palabra: "[y]a[c]imiento", pista: "de yacer: y inicial, c ante i",
    significado: "Lugar donde se hallan naturalmente minerales, rocas o restos arqueológicos.",
    sinonimos: ["depósito", "filón"], icono: "yacimiento" },
  { semana: 1, palabra: "es[b]elto", pista: "¡con b, no con v!",
    significado: "Que tiene un cuerpo alto, delgado y de proporciones armoniosas.",
    sinonimos: ["delgado", "estilizado"], icono: "cipres" },
  { semana: 1, palabra: "ur[g]en[c]ia", pista: "ge con g; -encia con c",
    significado: "Cualidad de urgente, es decir, que necesita atención o solución inmediata.",
    sinonimos: ["emergencia", "premura"], icono: "sirena" },
  { semana: 1, palabra: "apo[g]eo", pista: "ge con g, no con j",
    significado: "Punto culminante o momento de mayor esplendor de algo.",
    sinonimos: ["culminación", "esplendor"], icono: "cumbre" },
  { semana: 1, palabra: "[v]a[ll]a", pista: "valla (cerca) ≠ vaya (ir) ≠ baya (fruto)",
    significado: "Cercado de tablas, estacas u otro material que delimita un terreno.",
    sinonimos: ["cercado", "vallado"], icono: "valla" },
  { semana: 1, palabra: "[v]islum[b]rar", pista: "v inicial; tras m, siempre b",
    significado: "Ver algo de forma confusa o a lo lejos, o intuirlo por indicios.",
    sinonimos: ["entrever", "atisbar"], icono: "prismaticos" },
  { semana: 1, palabra: "e[s]par[c]ir", pista: "s, no x; verbos en -cir: con c",
    significado: "Extender o separar lo que estaba junto o amontonado.",
    sinonimos: ["dispersar", "difundir"], icono: "semillas" },

  // ---------- VOCABULARIO 2 ----------
  { semana: 2, palabra: "e[x]pl[í]cito", pista: "ex + pl → con x; esdrújula: tilde",
    significado: "Dicho con claridad.",
    sinonimos: ["claro", "expreso"], icono: "💬" },
  { semana: 2, palabra: "[ps]ic[ó]logo", pista: "psico- = mente: la p no suena, pero se escribe",
    significado: "Profesional que estudia la mente y la conducta.",
    sinonimos: ["terapeuta", "especialista"], icono: "🧠" },
  { semana: 2, palabra: "[y]a[c]er", pista: "y inicial; familia: yace, yacimiento",
    significado: "Estar tendido.",
    sinonimos: ["reposar", "descansar"], icono: "🛌" },
  { semana: 2, palabra: "conser[j]e", pista: "acaba en -je → con j (garaje, viaje)",
    significado: "Persona que cuida y vigila un edificio.",
    sinonimos: ["portero", "vigilante"], icono: "🔑" },
  { semana: 2, palabra: "e[x]traescolar", pista: "extra- (= fuera de) siempre con x",
    significado: "Que se hace fuera del horario de clases.",
    sinonimos: ["complementario", "voluntario"], icono: "⚽" },
  { semana: 2, palabra: "obstru[cc]i[ó]n", pista: "obstructor tiene -ct- → -cción; aguda en -n: tilde",
    significado: "Hecho de impedir el paso.",
    sinonimos: ["bloqueo", "atasco"], icono: "🚧" },
  { semana: 2, palabra: "e[x]i[g]ir", pista: "verbos en -gir con g; pero: exijo, exija",
    significado: "Pedir con fuerza algo a lo que se tiene derecho.",
    sinonimos: ["reclamar", "demandar"], icono: "✊" },
  { semana: 2, palabra: "co[h]esi[ó]n", pista: "h intercalada, como adhesión",
    significado: "Unión fuerte entre las partes.",
    sinonimos: ["unión", "adhesión"], icono: "🧩" },
  { semana: 2, palabra: "[o]quedad", pista: "¡trampa! hueco lleva h, oquedad NO",
    significado: "Espacio hueco en una superficie.",
    sinonimos: ["hueco", "cavidad"], icono: "🕳️" },
  { semana: 2, palabra: "bu[h]ardilla", pista: "bu- con b; h intercalada; -illa con ll",
    significado: "Habitación en el último piso, bajo el tejado.",
    sinonimos: ["desván", "ático"], icono: "🏠" },
  { semana: 2, palabra: "atra[y]ente", pista: "de atraer: y, como en atrayendo",
    significado: "Que atrae.",
    sinonimos: ["atractivo", "seductor"], icono: "🧲" },
  { semana: 2, palabra: "in[v]ersi[ó]n", pista: "n + v; -sión porque existe inversor",
    significado: "Dinero que se pone en un negocio para ganar más.",
    sinonimos: ["desembolso", "aportación"], icono: "💰" },

  // ---------- VOCABULARIO 3 ----------
  { semana: 3, palabra: "[h]onesto", pista: "h inicial, como honrado y honor",
    significado: "Que actúa con rectitud y sinceridad.",
    sinonimos: ["honrado", "íntegro"], icono: "🤝" },
  { semana: 3, palabra: "[h]a[ll]a", pista: "halla (hallar) ≠ haya (haber) ≠ aya (niñera)",
    significado: "Forma del verbo «hallar».",
    sinonimos: ["encuentra", "descubre"], icono: "🔍" },
  { semana: 3, palabra: "re[h]usar", pista: "h intercalada; sin tilde, pero rehúso",
    significado: "No aceptar algo.",
    sinonimos: ["rechazar", "declinar"], icono: "🙅" },
  { semana: 3, palabra: "a[v]er[í]a", pista: "con v; tilde en la í (hiato)",
    significado: "Daño que impide que una máquina funcione.",
    sinonimos: ["fallo", "desperfecto"], icono: "🔧" },
  { semana: 3, palabra: "e[s]qui[v]ar", pista: "es-, no ex-; después, v",
    significado: "Evitar algo con habilidad.",
    sinonimos: ["eludir", "sortear"], icono: "🏃" },
  { semana: 3, palabra: "ra[y]ado", pista: "rayado (rayas) ≠ rallado (rallar queso)",
    significado: "Con rayas.",
    sinonimos: ["listado", "marcado"], icono: "🦓" },
  { semana: 3, palabra: "o[b]stinado", pista: "obs- con b",
    significado: "Que se mantiene firme en una idea.",
    sinonimos: ["terco", "tenaz"], icono: "🐂" },
  { semana: 3, palabra: "corre[g]ir", pista: "verbos en -gir con g; pero: corrijo, corrija",
    significado: "Quitar los errores de algo.",
    sinonimos: ["rectificar", "enmendar"], icono: "✏️" },
  { semana: 3, palabra: "[v]i[g]ente", pista: "v, como vigor; -gente con g",
    significado: "Que está en vigor.",
    sinonimos: ["actual", "válido"], icono: "📜" },
  { semana: 3, palabra: "a[ct]itud", pista: "actitud (postura) ≠ aptitud (capacidad)",
    significado: "Postura o disposición de ánimo ante algo.",
    sinonimos: ["postura", "talante"], icono: "😎" },
  { semana: 3, palabra: "a[b]stenerse", pista: "abs- con b",
    significado: "Privarse voluntariamente de hacer algo.",
    sinonimos: ["privarse", "renunciar"], icono: "🚫" },
  { semana: 3, palabra: "estr[é]s", pista: "aguda acabada en -s: lleva tilde",
    significado: "Tensión nerviosa por exceso de trabajo o de preocupaciones.",
    sinonimos: ["agobio", "tensión"], icono: "😫" },

  // ---------- VOCABULARIO 4 ----------
  // { semana: 4, palabra: "...", pista: "...", significado: "...", sinonimos: ["...", "..."], icono: "🦉" },
];
</script>
<style>
:root{
  --paper:#FAFCFF;
  --rule:#BCD4EE;
  --ink:#1D2B5C;
  --ink-soft:#56628A;
  --red:#D62839;
  --yellow:#FFE35A;
  --mint:#A8E6CF;
  --teal:#157A6E;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 5.2rem, #F3B6BD 5.2rem, #F3B6BD calc(5.2rem + 2px), transparent calc(5.2rem + 2px)),
    repeating-linear-gradient(to bottom, transparent 0 31px, #E6EEF8 31px 32px);
  display:flex;flex-direction:column;
  overflow-x:hidden;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}

/* ---------- barra superior ---------- */
.top{
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
  padding:.7rem 1.4rem .7rem 6.2rem;
}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.02em;margin-right:auto}
.brand .hl{font-size:1.2em}
.ctl{
  background:#fff;border:2px solid var(--ink);border-radius:999px;
  padding:.35rem .9rem;font-size:.9rem;cursor:pointer;
}
.ctl[aria-pressed="true"]{background:var(--ink);color:#fff}
select.ctl{padding-right:.6rem}

/* ---------- escenario ---------- */
main{flex:1;display:flex;align-items:stretch;padding:0 1.4rem 0 6.2rem;min-height:0}
.slide{width:100%;display:flex;flex-direction:column;justify-content:center;padding:1rem 0 1.5rem}
.slide>*{flex-shrink:0}

/* ---------- pauta caligráfica y letras difíciles ---------- */
.pauta{
  position:relative;display:block;white-space:nowrap;
  line-height:1.5;padding:0 .15em;
  background:
    linear-gradient(to bottom,
      transparent calc(24% - 1px), var(--rule) calc(24% - 1px), var(--rule) 24%, transparent 24%,
      transparent calc(76% - 2px), var(--rule) calc(76% - 2px), var(--rule) 76%, transparent 76%),
    repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px) 0 48% / 100% 1px no-repeat;
}
.hl{
  color:var(--red);font-size:1.3em;display:inline-block;
  position:relative;line-height:1;transform:translateY(.02em);
}
.hl::after{
  content:"";position:absolute;left:-.05em;right:-.05em;bottom:-.12em;height:.14em;
  background:var(--red);border-radius:50% 40% 60% 45%;transform:rotate(-2deg);opacity:.85;
}

/* ---------- portada ---------- */
.cover{align-items:flex-start;gap:1.2rem}
.cover h1{font-size:clamp(2.6rem,8vw,9rem);font-weight:800;letter-spacing:.01em;line-height:1}
.cover p{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink-soft);max-width:40ch}
.cover .note{font-family:"Caveat",cursive;color:var(--red);font-size:clamp(1.4rem,2.4vw,2.2rem);transform:rotate(-2deg)}
.big{
  background:var(--ink);color:#fff;border:0;border-radius:999px;
  padding:.8rem 2rem;font-size:1.2rem;font-weight:600;cursor:pointer;margin-top:.6rem;
}

/* ---------- tarjetas de palabra ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1rem,2.5vw,2.5rem);align-items:start}
.card{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.ico{height:clamp(70px,11vh,120px);display:flex;align-items:flex-end}
.ico svg{height:100%;width:auto;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico .a{fill:var(--yellow)} .ico .g{fill:var(--mint)} .ico .r{fill:var(--red)} .ico .k{fill:var(--ink);stroke:none}
.ico .emoji{font-size:clamp(56px,9vh,100px);line-height:1}
.word{
  font-size:clamp(1.9rem,3.7vw,3.6rem);font-weight:600;cursor:default;
  border-radius:4px;transition:filter .3s;
}
.pista{font-family:"Caveat",cursive;font-size:clamp(1.25rem,1.9vw,1.8rem);color:var(--red);line-height:1.1;transform:rotate(-1.2deg);transform-origin:left}
.acts{display:flex;gap:.5rem;flex-wrap:wrap}
.tog{
  border:2px solid var(--ink);background:#fff;border-radius:10px;
  padding:.4rem .8rem;font-size:clamp(.85rem,1.1vw,1rem);cursor:pointer;font-weight:600;
}
.tog[aria-expanded="true"]{background:var(--ink);color:#fff}
.box{display:none;font-size:clamp(1rem,1.45vw,1.3rem);line-height:1.5;max-width:34ch}
.box.open{display:block;animation:pop .25s ease-out}
.box.sig{border-left:4px solid var(--teal);padding-left:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem .8rem;list-style:none;padding:0}
.chips li{
  font-weight:600;padding:0 .3em;
  background:linear-gradient(100deg, transparent 2%, var(--yellow) 4%, var(--yellow) 94%, transparent 98%) 0 60% / 100% 70% no-repeat;
}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* modo reto: se oculta la palabra y se muestra el significado */
body.reto .word:not(.shown){filter:blur(14px);cursor:pointer;user-select:none}
body.reto .word:not(.shown) .hl::after{display:none}
body.reto .pista:not(.shown){visibility:hidden}
/* renglón para que un alumno escriba la palabra en la pizarra antes de destaparla */
/* recuadro para escribir la palabra con el teclado antes de destaparla */
.escribe{display:none}
body.reto .escribe,.quiz .escribe{display:flex;align-items:center;gap:.6rem;margin-top:.4rem}
.quiz .escribe{width:min(100%,1100px);margin-top:0}
.resp{
  flex:1;min-width:0;font:600 clamp(1.6rem,3vw,3rem) "Lexend",system-ui,sans-serif;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:12px;padding:.25em .5em;outline:none;
}
.quiz .resp{font-size:clamp(1.5rem,2.6vw,2.4rem);padding:.15em .5em}
.resp::placeholder{font-family:"Caveat",cursive;font-weight:600;font-size:.75em;color:var(--ink-soft);opacity:.7}
.resp:focus{box-shadow:0 0 0 4px rgba(46,155,125,.35)}
.escribe.ok .resp{border-color:var(--teal);background:#DDF5EC}
.escribe.ko .resp{border-color:var(--red);background:#FCE3E6}
.escribe .marca{font-size:clamp(1.6rem,3vw,2.8rem);font-weight:800;line-height:1}
.escribe.ok .marca{color:var(--teal)} .escribe.ko .marca{color:var(--red)}
/* ---------- juego ---------- */
.quiz{gap:1.2rem}
.quiz .q{font-size:clamp(1.3rem,2.6vw,2.3rem);line-height:1.35;max-width:none;border-left:5px solid var(--teal);padding-left:1rem}
.opts{display:flex;flex-wrap:wrap;gap:1rem}
.opt{
  background:#fff;border:3px solid var(--ink);border-radius:14px;cursor:pointer;
  padding:.4rem 1.4rem;font-size:clamp(1.4rem,2.8vw,2.6rem);font-weight:600;
}
.opt.ok{border-color:var(--teal);background:#DDF5EC}
.opt.ko{border-color:var(--red);background:#FCE3E6;text-decoration:line-through}
.fb{font-family:"Caveat",cursive;font-size:clamp(1.5rem,2.6vw,2.4rem);min-height:1.3em}
.fb.ok{color:var(--teal)} .fb.ko{color:var(--red)}
/* ---------- reto para valientes ---------- */
.val{gap:1rem}
.val h2{font-size:clamp(2rem,4.2vw,3.8rem);font-weight:800;line-height:1.1}
.val .reglas{list-style:none;padding:0;display:grid;gap:.5rem;font-size:clamp(1.2rem,2.2vw,2rem);line-height:1.3}
.val .reglas b{white-space:nowrap}
.val .aviso{font-family:"Caveat",cursive;color:var(--red);font-size:clamp(1.5rem,2.6vw,2.4rem);transform:rotate(-1deg);transform-origin:left}
.val .nombre{font:600 clamp(1.2rem,2vw,1.8rem) "Lexend",sans-serif;border:3px solid var(--ink);border-radius:12px;padding:.3em .6em;width:min(100%,520px);outline:none}
.val .elige{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;font-size:clamp(1.1rem,1.9vw,1.7rem);font-weight:600}
.val .num{width:clamp(3.4rem,6vw,5.2rem);height:clamp(3.4rem,6vw,5.2rem);border-radius:50%;border:4px solid var(--ink);background:#fff;
  font:800 clamp(1.6rem,3vw,2.6rem) "Lexend",sans-serif;color:var(--ink);cursor:pointer;transition:transform .15s}
.val .num:hover{transform:scale(1.1);background:var(--yellow)}
.val .num small{display:block;font-size:.35em;font-weight:600;margin-top:-.2em}
.marcador{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.4rem;font-size:clamp(1.1rem,1.9vw,1.7rem);font-weight:600;
  background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.4rem 1rem;align-self:stretch}
.marcador .pts{margin-left:auto;font-size:1.5em;font-weight:800}
.pts.pos{color:var(--teal)} .pts.neg{color:var(--red)}
.marcador .snd{border:0;background:none;font-size:1.2em;cursor:pointer}
.pts.salta{animation:salta .5s ease-out;transform-origin:right center}
@keyframes salta{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.val .veredicto{font-size:clamp(2rem,4.5vw,4rem);font-weight:800;animation:pop .3s ease-out}
.val .veredicto.ok{color:var(--teal)} .val .veredicto.ko{color:var(--red)}
.val .final{font-size:clamp(4rem,11vw,9rem);font-weight:800;line-height:1;animation:salta .7s ease-out;transform-origin:left center}
.val .resumen{display:flex;flex-wrap:wrap;gap:.4rem .7rem;list-style:none;padding:0;font-size:clamp(1.1rem,1.8vw,1.6rem);font-weight:600}
.val .resumen li{padding:.1em .5em;border-radius:8px;background:#DDF5EC}
.val .resumen li.ko{background:#FCE3E6;text-decoration:line-through;text-decoration-color:var(--red)}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:50}
.val .datos{display:flex;gap:1rem;flex-wrap:wrap}
.val .nombre.grupo{width:min(100%,280px)}
.val .verres{align-self:flex-start}
.hints .mitad{color:var(--ink-soft);font-size:.8em}
.val .q .nota{font-size:.7em;color:var(--ink-soft)}
.candado .escribe{width:min(100%,520px)}
.candado .escribe.ko .resp{animation:sacude .35s}
@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.guardado{color:var(--teal);font-weight:700;font-size:clamp(1rem,1.5vw,1.3rem)}
.resov{position:fixed;inset:0;z-index:60;background:rgba(20,28,60,.55);display:grid;place-items:center;padding:2vh 2vw}
.resbox{position:relative;background:#fff;border-radius:20px;padding:1.4rem 1.6rem;width:min(96vw,1400px);max-height:94vh;display:flex;flex-direction:column;gap:1rem;font-size:clamp(1rem,1.6vw,1.5rem)}
.resbox h3{font-size:1.4em;margin:0;padding-right:2.5rem}
.resx{position:absolute;top:.6rem;right:.8rem;border:0;background:none;font-size:2rem;cursor:pointer;color:var(--ink)}
.restab{overflow:auto;min-height:0}
.restab table{border-collapse:collapse;width:100%}
.restab th,.restab td{border-bottom:1px solid #dde3f0;padding:.35em .6em;text-align:left;white-space:nowrap}
.restab th{position:sticky;top:0;background:#F3F6FC}
.resbtns{display:flex;gap:1rem;flex-wrap:wrap}
.resnota{color:var(--ink-soft);font-size:.8em;margin:0}
.hints{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;font-size:clamp(1.2rem,2.2vw,2rem);color:var(--ink)}
.hints:empty{display:none}
.hints b{padding:0 .3em;background:linear-gradient(100deg, transparent 2%, var(--yellow) 4%, var(--yellow) 94%, transparent 98%) 0 60% / 100% 70% no-repeat}
.opt.pistab{background:#FFF6D6;border-color:#C9A227;font-size:clamp(1.1rem,2vw,1.9rem)}
.alc{display:flex;gap:.6rem;flex-wrap:wrap;align-self:flex-start}
.alc .tog{font-size:clamp(.95rem,1.3vw,1.15rem);padding:.45rem 1rem}
.cover .btns{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.cover .big.alt{background:#fff;color:var(--ink);border:3px solid var(--ink)}
.voc-tag{font-size:.85em;color:var(--ink-soft)}
.fb{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;min-height:0}
.fb:empty{display:none}
.fb:not(:empty){margin-bottom:.6rem}
.sol{display:inline-block;font-family:"Lexend",sans-serif;font-weight:600;color:var(--ink);font-size:clamp(2.6rem,6vw,5rem);line-height:1.35;animation:pop .3s ease-out}
.fb-syn{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;font-family:"Lexend",sans-serif;font-size:clamp(1.2rem,2.2vw,2rem);color:var(--ink)}
.fb-syn .chips li{font-size:1em}
.score{color:var(--ink-soft)}

/* ---------- navegación ---------- */
.nav{display:flex;align-items:center;justify-content:center;gap:1rem;padding:.6rem 1.4rem 1rem 6.2rem}
.arrow{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.4rem;cursor:pointer}
.arrow:disabled{opacity:.3;cursor:default}
.count{min-width:6ch;text-align:center;font-weight:600}
.empty{font-size:1.4rem;color:var(--ink-soft)}

@media (max-width:820px){
  body{background-image:repeating-linear-gradient(to bottom, transparent 0 31px, #E6EEF8 31px 32px)}
  .top,main,.nav{padding-left:1rem;padding-right:1rem}
  .grid{grid-template-columns:1fr;gap:2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="pauta" style="display:inline-block">[V]OCA[B]ULARIO</span></div>
  <button class="ctl" id="btnHome" title="Volver a la portada">⌂ Inicio</button>
  <label>
    <select class="ctl" id="week" aria-label="Elegir vocabulario"></select>
  </label>
  <button class="ctl" id="btnAll">Mostrar todo</button>
  <button class="ctl" id="btnReto" aria-pressed="false" title="Palabra borrosa, definición, sinónimos como pista y recuadro para escribir la palabra">👥 Reto colectivo</button>
  <button class="ctl" id="btnFull" title="Pantalla completa (F)">⛶ Pantalla completa</button>
</header>

<main id="stage"></main>

<nav class="nav" aria-label="Diapositivas">
  <button class="arrow" id="prev" aria-label="Anterior">‹</button>
  <span class="count" id="count"></span>
  <button class="arrow" id="next" aria-label="Siguiente">›</button>
</nav>

<script>
/* ====================== BIBLIOTECA DE ICONOS ====================== */
const ICONOS = {
  ojo:`<path d="M5 32 Q32 8 59 32 Q32 56 5 32Z"/><circle class="a" cx="32" cy="32" r="10"/><circle class="k" cx="32" cy="32" r="4"/><path class="r" d="M52 5 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/>`,
  megafono:`<path class="a" d="M8 25 h11 l25 -15 v44 l-25 -15 h-11z"/><path d="M14 39 l4 15 h7 l-3 -15"/><path d="M50 23 q5 9 0 18"/><path d="M55 16 q10 16 0 32"/>`,
  suspiro:`<circle class="a" cx="24" cy="32" r="18"/><path d="M15 28 q3 -3 6 0 M26 28 q3 -3 6 0"/><circle cx="28" cy="39" r="2.5"/><path d="M45 34 q4 -3 8 0 t8 0 M45 42 q4 3 8 0 t8 0"/>`,
  etiqueta:`<path class="a" d="M5 20 h38 l14 12 -14 12 h-38z"/><circle cx="47" cy="32" r="2.5"/><text x="23" y="37" font-size="12.5" text-anchor="middle" font-family="Lexend,sans-serif" font-weight="600" fill="#1D2B5C" stroke="none">-mente</text>`,
  desierto:`<circle class="a" cx="49" cy="15" r="7"/><path d="M3 55 h58"/><path class="g" d="M26 55 v-31 a5 5 0 0 1 10 0 v31z"/><path d="M26 39 h-5 a4 4 0 0 1 -4 -4 v-7 M36 43 h5 a4 4 0 0 0 4 -4 v-7"/><path d="M8 55 q3 -4 6 0 M48 55 q3 -4 6 0"/>`,
  yacimiento:`<path class="a" d="M3 30 h58 v28 h-58z"/><path d="M3 43 q14 -5 29 0 t29 0"/><path d="M17 50 h14" stroke-width="4"/><circle cx="16" cy="48" r="2"/><circle cx="16" cy="52" r="2"/><circle cx="32" cy="48" r="2"/><circle cx="32" cy="52" r="2"/><path d="M44 30 l8 -24 M40 10 q12 -6 22 2"/>`,
  cipres:`<path class="g" d="M32 4 C45 20 43 44 35 54 h-6 C21 44 19 20 32 4z"/><path d="M32 54 v6 M20 60 h24 M32 22 v26"/>`,
  sirena:`<path class="r" d="M18 50 v-16 a14 14 0 0 1 28 0 v16z"/><path class="a" d="M12 50 h40 v8 h-40z"/><path d="M32 5 v7 M11 13 l5 5 M53 13 l-5 5 M3 32 h7 M54 32 h7"/>`,
  cumbre:`<path class="g" d="M3 57 L25 20 L35 34 L44 23 L61 57z"/><path d="M25 20 V5"/><path class="r" d="M25 5 L37 9.5 L25 14z"/>`,
  valla:`<path class="a" d="M8 57 V20 l5 -6 5 6 V57z M23 57 V20 l5 -6 5 6 V57z M38 57 V20 l5 -6 5 6 V57z"/><path d="M3 29 h56 M3 46 h56"/><path d="M53 57 V22 l5 -6"/>`,
  prismaticos:`<circle class="a" cx="19" cy="41" r="12"/><circle class="a" cx="45" cy="41" r="12"/><path d="M11 32 l5 -18 h7 l3 15 M53 32 l-5 -18 h-7 l-3 15 M29 37 h6"/><circle class="k" cx="19" cy="41" r="4"/><circle class="k" cx="45" cy="41" r="4"/>`,
  semillas:`<path class="a" d="M6 50 q6 -18 20 -18 l6 6 q-4 16 -20 18z"/><circle class="k" cx="40" cy="30" r="2.6"/><circle class="k" cx="48" cy="22" r="2.6"/><circle class="k" cx="46" cy="36" r="2.6"/><circle class="k" cx="56" cy="14" r="2.6"/><circle class="k" cx="57" cy="30" r="2.6"/><circle class="k" cx="54" cy="44" r="2.6"/><circle class="k" cx="38" cy="16" r="2.6"/>`,
  libro:`<path class="a" d="M32 16 q-12 -6 -26 -2 v36 q14 -4 26 2 q12 -6 26 -2 v-36 q-14 -4 -26 2z"/><path d="M32 16 v36"/>`
};
function icon(name){
  if(name && ICONOS[name]) return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONOS[name]}</svg>`;
  if(name) return `<span class="emoji" aria-hidden="true">${name}</span>`;
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONOS.libro}</svg>`;
}

/* ====================== LÓGICA ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const markup = p => esc(p).replace(/\[([^\]]+)\]/g,'<span class="hl">$1</span>');
const plain  = p => p.replace(/[\[\]]/g,'');

document.querySelectorAll('.brand .pauta').forEach(el => el.innerHTML = markup(el.textContent));

let lista = [], slides = [], cur = 0;
let quiz = null, score = {ok:0,total:0};

const semanas = [...new Set(PALABRAS.map(p => p.semana))].sort((a,b)=>a-b);
$('#week').innerHTML = semanas.slice().reverse().map(s => `<option value="${s}">Vocabulario ${s}</option>`).join('') +
  `<option value="all">Todos los vocabularios</option>`;
$('#week').value = String(semanas[semanas.length-1]);   // al abrir: el último vocabulario
const titulo = () => { const w = $('#week').value; return '[V]OCA[B]ULARIO' + (w==='all' ? '' : ` (${w})`); };

function build(){
  const w = $('#week').value;
  document.querySelectorAll('.brand .pauta').forEach(el => el.innerHTML = markup(titulo()));
  document.title = plain(titulo()).charAt(0) + plain(titulo()).slice(1).toLowerCase();
  lista = PALABRAS.map((p,i)=>({...p,id:i})).filter(p => w==='all' || String(p.semana)===w);
  slides = [{type:'cover'}];
  for(let i=0;i<lista.length;i+=3) slides.push({type:'words', items:lista.slice(i,i+3)});
  if(lista.length) slides.push({type:'quiz'});
  slides.push({type:'valientes'});
}

function render(){
  const s = slides[cur];
  const st = $('#stage');
  if(s.type==='cover'){
    const n = lista.length, w = $('#week').value;
    st.innerHTML = `<section class="slide cover">
      <h1 class="pauta">${markup(titulo())}</h1>
      <p>Repaso colectivo de significados y sinónimos.</p>
      <span class="note">¡Ojo a las letras en rojo!</span>
      ${n ? `<div class="btns"><button class="big" id="go">Empezar</button><button class="big alt" id="goCol">👥 Reto colectivo</button><button class="big alt" id="goAll">🦁 Reto individual 🔒</button></div>` : `<p class="empty">No hay palabras en este vocabulario.</p>`}
    </section>`;
    const go = $('#go'); if(go) go.onclick = () => { ponReto(false); goTo(1); };
    const ga = $('#goAll'); if(ga) ga.onclick = () => { VAL.fase = 'reglas'; goTo(slides.length-1); };
    const gc = $('#goCol'); if(gc) gc.onclick = () => { ponReto(true); goTo(1); };
  }
  else if(s.type==='words'){
    st.innerHTML = `<section class="slide"><div class="grid">${s.items.map(card).join('')}</div></section>`;
    st.querySelectorAll('.card').forEach(bindCard);
    fitWords();
  }
  else if(s.type==='valientes'){ renderValientes(); }
  else { renderQuiz(); }
  $('#count').textContent = `${cur+1} / ${slides.length}`;
  $('#prev').disabled = cur===0;
  $('#next').disabled = cur===slides.length-1;
  $('#btnAll').style.visibility = s.type==='words' ? 'visible' : 'hidden';
  $('#btnReto').style.display = s.type==='words' ? '' : 'none';   // solo en las diapositivas de palabras
  $('#btnAll').textContent = 'Mostrar todo';
}

function card(p){
  const reto = document.body.classList.contains('reto');
  return `<article class="card">
    <div class="ico">${icon(p.icono)}</div>
    <h2 class="word pauta" tabindex="0" aria-label="${esc(plain(p.palabra))}">${markup(p.palabra)}</h2>
    <p class="pista">${esc(p.pista||'')}</p>
    <div class="acts">
      <button class="tog" data-t="sig" aria-expanded="${reto}">Significado</button>
      <button class="tog" data-t="sin" aria-expanded="false">Sinónimos</button>
    </div>
    <div class="box sig ${reto?'open':''}">${esc(p.significado)}</div>
    <div class="box sin"><ul class="chips">${p.sinonimos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="escribe"><input class="resp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="✍️ Escribe aquí" aria-label="Escribe la palabra"><span class="marca" aria-live="polite"></span></div>
  </article>`;
}

function bindCard(c){
  c.querySelectorAll('.tog').forEach(b => b.onclick = () => {
    const box = c.querySelector('.box.'+b.dataset.t);
    const open = !box.classList.contains('open');
    box.classList.toggle('open', open);
    b.setAttribute('aria-expanded', open);
  });
  const w = c.querySelector('.word');
  const reveal = () => { w.classList.add('shown'); c.querySelector('.pista').classList.add('shown'); comprobar(c, lista.find(x=>String(x.id)===c.dataset.id)?.palabra || w.getAttribute('aria-label')); };
  w.onclick = reveal;
  const inp = c.querySelector('.resp');
  if(inp) inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); reveal(); } };
  w.onkeydown = e => { if(e.key==='Enter'){ reveal(); } };
}

function fitWords(){
  document.querySelectorAll('.word').forEach(w => {
    w.style.fontSize = '';
    let size = parseFloat(getComputedStyle(w).fontSize);
    while(w.scrollWidth > w.clientWidth && size > 16){ size -= 2; w.style.fontSize = size+'px'; }
  });
}

function showAll(){
  const cards = document.querySelectorAll('.card');
  const anyClosed = [...document.querySelectorAll('.box')].some(b => !b.classList.contains('open'));
  cards.forEach(c => {
    c.querySelectorAll('.box').forEach(b => b.classList.toggle('open', anyClosed));
    c.querySelectorAll('.tog').forEach(b => b.setAttribute('aria-expanded', anyClosed));
    if(anyClosed){ c.querySelector('.word').classList.add('shown'); c.querySelector('.pista').classList.add('shown'); }
  });
  $('#btnAll').textContent = anyClosed ? 'Ocultar todo' : 'Mostrar todo';
}

/* ---------- juego: ¿qué palabra es? ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let mazo = [], vistas = 0, fin = false;
/* alcance del juego: 'actual' = el vocabulario elegido · 'todas' = todas las palabras vistas hasta ahora */
let alcance = 'actual';
const TODAS = PALABRAS.map((p,i)=>({...p,id:i}));
const pool = () => alcance==='todas' ? TODAS : lista;
function nuevoMazo(){ mazo = shuffle([...pool()]); vistas = 0; fin = false; }
function alcanceHTML(){
  const w = $('#week').value;
  if(w==='all' || semanas.length<2) return '';
  return `<div class="alc">
    <button class="tog" data-a="actual" aria-expanded="${alcance==='actual'}">Solo vocabulario ${w}</button>
    <button class="tog" data-a="todas" aria-expanded="${alcance==='todas'}">🎯 Todas las palabras vistas (${TODAS.length})</button>
  </div>`;
}
function bindAlcance(){
  document.querySelectorAll('.alc .tog').forEach(b => b.onclick = () => {
    if(alcance===b.dataset.a) return;
    alcance = b.dataset.a; nuevoMazo(); newQuiz(); renderQuiz();
  });
}
function newQuiz(){
  if(!mazo.length){ fin = true; return; }
  quiz = { target: mazo.shift(), done:false };
  vistas++;
}
function renderQuiz(){
  if(!quiz || !pool().some(p=>p.id===quiz.target.id)){ nuevoMazo(); newQuiz(); }
  const total = pool().length;
  if(fin){
    $('#stage').innerHTML = `<section class="slide quiz">
      ${alcanceHTML()}
      <h2 class="pauta" style="font-size:clamp(1.6rem,3vw,2.6rem);font-weight:800;align-self:flex-start">¡Fin del repaso!</h2>
      <p class="q">Ya habéis descubierto las ${total} palabras.</p>
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <button class="big" id="restart" style="margin:0">Empezar de nuevo</button>
      </div>
    </section>`;
    $('#restart').onclick = () => { nuevoMazo(); newQuiz(); renderQuiz(); };
    bindAlcance();
    return;
  }
  const q = quiz;
  const ultima = !mazo.length;
  $('#stage').innerHTML = `<section class="slide quiz">
    ${alcanceHTML()}
    <h2 class="pauta" style="font-size:clamp(1.6rem,3vw,2.6rem);font-weight:800;align-self:flex-start">¿Qué palabra es?</h2>
    <p class="q">${esc(q.target.significado)}</p>
    <div class="hints" id="hints"></div>
    <div class="escribe"><input class="resp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="✍️ Escribe aquí" aria-label="Escribe la palabra"><span class="marca" aria-live="polite"></span></div>
    <div class="opts"><button class="opt pistab" id="hint">💡 Pista: un sinónimo</button><button class="opt" id="reveal">Descubrir la palabra</button></div>
    <p class="fb" id="fb"></p>
    <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
      <button class="big" id="again" style="margin:0">${ultima ? 'Finalizar' : 'Otra definición'}</button>
      <span class="score">Palabra ${vistas} de ${total}${alcance==='todas' ? ` <span class="voc-tag">· del vocabulario ${q.target.semana}</span>` : ''}</span>
    </div>
  </section>`;
  $('#reveal').onclick = () => {
    if(q.done) return;
    q.done = true;
    comprobar($('#stage .quiz'), q.target.palabra);
    $('#hints').innerHTML = '';   // los sinónimos ya salen con la solución
    $('#reveal').parentElement.remove();
    const fb = $('#fb');
    fb.className = 'fb ok';
    fb.innerHTML = `<span class="sol pauta">${markup(q.target.palabra)}</span>
      <span class="fb-syn">Sinónimos: <ul class="chips">${q.target.sinonimos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></span>`;
  };
  q.hints = q.hints || 0;
  const pintaPistas = () => {
    $('#hints').innerHTML = q.target.sinonimos.slice(0, q.hints).map(x => `<span>💡 Sinónimo: <b>${esc(x)}</b></span>`).join('');
    const h = $('#hint'); if(!h) return;
    if(q.hints >= q.target.sinonimos.length) h.remove();
    else h.textContent = q.hints ? '💡 Otro sinónimo' : '💡 Pista: un sinónimo';
  };
  $('#hint').onclick = () => { q.hints++; pintaPistas(); $('#stage .resp')?.focus(); };
  pintaPistas();
  $('#again').onclick = () => { newQuiz(); renderQuiz(); };
  const qi = $('#stage .resp');
  if(qi) qi.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); if(!q.done) $('#reveal').click(); else $('#again').click(); } };
  bindAlcance();
}

/* ---------- reto para valientes ---------- */
/* Acierto +0,20 · acierto con pista (un sinónimo) +0,10 · fallo −0,20 (sobre la nota de clase de 10). Entre 4 y 8 palabras de todas las vistas. */
const VAL = { fase:'reglas', nombre:'', grupo:'', n:0, pal:[], i:0, ok:0, okp:0, ko:0, resp:false, pista:false, res:[], sonido:true };
let valUsadas = new Set();
const PUNTO = 0.20;

/* ===== FORMULARIO DE GOOGLE (opcional) =====
   Para que cada resultado llegue a un formulario, pega aquí la dirección del formulario
   (la que acaba en /viewform) y los códigos entry.XXXX de cada pregunta.
   Si se deja vacío, los resultados solo se guardan en este ordenador (botón «Resultados»). */
const FORM = {
  url: 'https://docs.google.com/forms/d/e/1FAIpQLSf64IultYXRpXO-HfMcUNhoybwDwQWQ6FftIx6nOjlioTq-5Q/viewform',
  campos: { alumno:'entry.669692600', grupo:'entry.146505032', puntos:'entry.1137417179',   // Alumno/a · Curso · Puntuación final
            fecha:'', palabras:'', aciertos:'', conPista:'', fallos:'', detalle:'' }
};

try{ VAL.grupo = localStorage.getItem('voc:grupo') || ''; }catch(e){}
let RESULTADOS = [];
try{ RESULTADOS = JSON.parse(localStorage.getItem('voc:resultados') || '[]'); }catch(e){ RESULTADOS = []; }
const guardaLista = () => { try{ localStorage.setItem('voc:resultados', JSON.stringify(RESULTADOS)); }catch(e){} };

const fmtPts = x => { const v = Math.round(x*1000)/1000; let t = Math.abs(v).toFixed(3); if(t.endsWith('0')) t = t.slice(0,-1); return (v>0?'+':v<0?'−':'') + t.replace('.',','); };
const ptsVal = () => (VAL.ok - VAL.ko) * PUNTO + VAL.okp * PUNTO/2;

let actx = null;
function sonar(tipo){
  if(!VAL.sonido) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notas = tipo==='ok' ? [[660,0],[880,.12]] : tipo==='ko' ? [[220,0],[165,.18]] : tipo==='pista' ? [[740,0]] : [[523,0],[659,.15],[784,.3],[1047,.45]];
    notas.forEach(([f,t]) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
      o.type = tipo==='ko' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.25,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+(tipo==='ko'?.35:.3));
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+.4);
    });
  }catch(e){}
}
function confeti(){
  const cv = document.createElement('canvas'); cv.id='confeti'; document.body.appendChild(cv);
  const c = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#D62839','#FFE35A','#157A6E','#A8E6CF','#1F2A5A'];
  const P = Array.from({length:160}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, vx:(Math.random()-.5)*4, vy:2+Math.random()*4, r:Math.random()*6, w:6+Math.random()*8, col:cols[Math.random()*cols.length|0]}));
  const t0 = performance.now();
  (function paso(t){
    c.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.r+=.1; c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle=p.col; c.fillRect(-p.w/2,-3,p.w,6); c.restore(); });
    if(t-t0 < 3200) requestAnimationFrame(paso); else cv.remove();
  })(t0);
}
function elegirPalabras(n){
  let libres = TODAS.filter(p => !valUsadas.has(p.id));
  if(libres.length < n){ valUsadas = new Set(); libres = [...TODAS]; }
  const sel = shuffle([...libres]).slice(0,n);
  sel.forEach(p => valUsadas.add(p.id));
  return sel;
}

/* ---- guardar y enviar resultados ---- */
function enviarFormulario(r){
  if(!FORM.url) return false;
  const C = FORM.campos, datos = { fecha:r.fecha, grupo:r.grupo, alumno:r.alumno, palabras:r.n, aciertos:r.ok, conPista:r.okp, fallos:r.ko, puntos:r.valor, detalle:r.detalle };
  const fr = document.createElement('iframe'); fr.name = 'envio'+Date.now(); fr.style.display='none'; document.body.appendChild(fr);
  const fm = document.createElement('form'); fm.method='POST'; fm.target=fr.name; fm.action = FORM.url.replace(/\/viewform.*$/,'/formResponse');
  Object.entries(C).forEach(([k,id]) => { if(!id) return; const i=document.createElement('input'); i.type='hidden'; i.name=id.startsWith('entry.')?id:'entry.'+id; i.value=datos[k]; fm.appendChild(i); });
  document.body.appendChild(fm); fm.submit();

function registrarResultado(){
  const d = new Date();
  const r = {
    fecha: d.toLocaleDateString('es-ES') + ' ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
    grupo: VAL.grupo, alumno: VAL.nombre || '(sin nombre)', n: VAL.n, ok: VAL.ok, okp: VAL.okp, ko: VAL.ko,
    puntos: fmtPts(ptsVal()),
    valor: String(Math.round(ptsVal()*1000)/1000).replace('.',','),   // número para Excel
    detalle: VAL.res.map(x => (x.ok ? (x.pista ? '💡✅ ' : '✅ ') : (x.pista ? '💡❌ ' : '❌ ')) + x.p + (x.ok ? '' : ' (escribió: ' + (x.escrito||'') + ')')).join(' · ')
  };
  RESULTADOS.push(r); guardaLista();

}
const csvCelda = v => '"' + String(v).replace(/"/g,'""') + '"';

  const txt = '﻿' + [cab,...filas].map(f => f.map(csvCelda).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download = 'resultados_reto_individual_vocabulario.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function verResultados(){

function marcadorHTML(){
  const p = ptsVal();
  return `<div class="marcador">
    <span>🦁 ${VAL.nombre ? esc(VAL.nombre) : 'Valiente'}</span>
    <span>Palabra ${Math.min(VAL.i+1,VAL.n)} de ${VAL.n}</span>

    <button class="snd" id="snd" title="Sonido">${VAL.sonido?'🔊':'🔇'}</button>

}
const bindSnd = () => { const b = $('#snd'); if(b) b.onclick = () => { VAL.sonido = !VAL.sonido; b.textContent = VAL.sonido?'🔊':'🔇'; }; };

/* candado del reto individual: solo lo abre el profesor (se guarda la huella de la clave, no la clave) */
const CLAVE_HUELLA = 0xb8a055fe;
const huella = t => { let h = 0x811c9dc5; for(const b of new TextEncoder().encode(t)){ h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; };
let retoAbierto = false;
function renderCandado(){
  $('#stage').innerHTML = `<section class="slide quiz val candado">
    <h2 class="pauta">🔒 Reto individual</h2>

    <div><button class="big" id="vabrir" style="margin:0">Abrir</button></div>
  </section>`;
  const inp = $('#vclave'), abrir = () => {
    if(huella(inp.value.trim().toLowerCase()) === CLAVE_HUELLA){ retoAbierto = true; renderValientes(); }
    else { const e = inp.parentElement; e.classList.remove('ko'); void e.offsetWidth; e.classList.add('ko'); e.querySelector('.marca').textContent='✗'; inp.select(); }

}

        <li>❌ Cada fallo: <b>−0,20 puntos</b> (una tilde o una letra mal = fallo)</li>
        <li>📝 Los puntos se suman o se descuentan de tu <b>nota de clase (sobre 10)</b>.</li>
      </ul>
      <span class="aviso">⚠️ Escribe siempre en minúsculas.</span>

    <div class="final ${p>0?'pts pos':p<0?'pts neg':'pts'}">${fmtPts(p)}</div>

    <ul class="resumen">${VAL.res.map(r=>`<li class="${r.ok?'':'ko'}">${r.ok?'✅':'❌'}${r.pista?'💡':''} ${esc(r.p)}</li>`).join('')}</ul>
    <div class="btns" style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center">

  if(p>0){ sonar('fin'); confeti(); }

  $('#vres').onclick = verResultados;
  $('#votro').focus();

/* ---------- comprobar lo escrito en el recuadro ---------- */
const normal = t => t.trim().replace(/\s+/g,' ').toLowerCase();
function comprobar(cont, palabra){
  const esc_ = cont && cont.querySelector('.escribe'); if(!esc_) return;
  const v = esc_.querySelector('.resp').value;
  if(!v.trim()) return;
  const ok = normal(v)===normal(plain(palabra));
  esc_.classList.remove('ok','ko'); esc_.classList.add(ok?'ok':'ko');
  esc_.querySelector('.marca').textContent = ok ? '✓' : '✗';
}

function goTo(i){ cur = Math.max(0, Math.min(slides.length-1, i)); render(); }
$('#prev').onclick = () => goTo(cur-1);
$('#next').onclick = () => goTo(cur+1);

$('#week').onchange = () => { build(); quiz=null; alcance='actual'; goTo(slides.length>1 ? 1 : 0); };

}

function toggleFull(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
$('#btnFull').onclick = toggleFull;
document.addEventListener('keydown', e => {
  if(e.target.tagName==='SELECT' || e.target.tagName==='INPUT') return;
  const onButton = e.target.tagName==='BUTTON';
  if(e.key==='ArrowRight' || e.key==='PageDown' || (e.key===' ' && !onButton)){ e.preventDefault(); goTo(cur+1); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); goTo(cur-1); }
  else if(e.key==='f' || e.key==='F') toggleFull();
  else if((e.key==='m' || e.key==='M') && slides[cur].type==='words') showAll();
});
/* si el contenido no cabe en la pantalla, se reduce todo un poco (nunca se solapa) */
function fitSlide(){
  const sec = $('#stage .slide'); if(!sec) return;
  sec.style.zoom = '';
  /* altura que necesita el contenido (medida sin reducir) frente a la que hay */
  const cs = getComputedStyle(sec), kids = [...sec.children].filter(k => k.offsetHeight);
  if(!kids.length) return;
  const gap = parseFloat(cs.rowGap) || 0;
  const need = kids.reduce((t,k) => t + k.offsetHeight + (parseFloat(getComputedStyle(k).marginTop)||0) + (parseFloat(getComputedStyle(k).marginBottom)||0), 0)
             + gap*(kids.length-1) + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const have = sec.clientHeight;
  if(need > have) sec.style.zoom = Math.max(0.6, (have/need)*0.97).toFixed(3);
}
new MutationObserver(() => requestAnimationFrame(fitSlide)).observe(document.getElementById('stage'), {childList:true, subtree:true});
window.addEventListener('resize', () => { if(slides[cur]?.type==='words') fitWords(); fitSlide(); });
document.fonts?.ready.then(() => { if(slides[cur]?.type==='words') fitWords(); fitSlide(); });

build(); render();

<script>
(function(){

  var G=function(n){if(n.indexOf('__')===0)return window[n];try{return (0,eval)('typeof '+n+'!=="undefined"?'+n+':undefined')}catch(e){return undefined}};

  function idxVar(){var a=['cur','actual','current','idx','index'];for(var i=0;i<a.length;i++){var v=G(a[i]);if(typeof v==='number')return v}return null}

    if(d.length>1){var best=-1,bv=0;d.forEach(function(e,i){var v=vis(e);if(v>bv){bv=v;best=i}});return {n:d.length,i:best,els:d}}

  }
  function title(st,i){
    if(st.els){var e=st.els[i],h=e.querySelector('h1,h2,h3,.titulo,.title');var t='';if(h){var c=h.cloneNode(true);[].forEach.call(c.querySelectorAll('.tag,.num,.pax,.badge,.chip,.pill'),function(x){x.remove()});[].forEach.call(c.querySelectorAll('br'),function(x){x.replaceWith(' ')});t=c.textContent;if(t.trim().length<3)t=h.textContent}else t=e.textContent||'';return t.replace(/\s+/g,' ').trim().slice(0,80)}
    var o=st.list[i];if(o&&typeof o==='object'){var t2=o.title||o.t||o.titulo||o.tit||o.h||o.word||o.palabra;if(typeof t2==='string')return t2.replace(/<[^>]+>/g,'').slice(0,80)}
    return '';
  }
  function key(k,c){var ev=new KeyboardEvent('keydown',{key:k,code:k,keyCode:c,which:c,bubbles:true,cancelable:true});document.body.dispatchEvent(ev)}
  var busy=false;
  function goTo(t){
    var st=state();if(!st||busy)return;t=Math.max(0,Math.min(st.n-1,t));
    var fs=['__go','__mostrar','__show','__goTo','__ir','goTo','go','ir','show','mostrar','irA','goToSlide','showSlide'];for(var k=0;k<fs.length;k++){var fn=G(fs[k]);if(typeof fn==='function'&&fn.length<=2){try{fn(t)}catch(e){}var s1=state();if(s1&&s1.i===t){upd();return}}}
    busy=true;
    var t0=Date.now(),stuck=0,last=st.i,wait=0;
    (function loop(){
      var s=state();if(!s||s.i===t||Date.now()-t0>15000){busy=false;upd();return}
      if(s.i<0&&++wait<12){setTimeout(loop,60);return}
      if(s.i===last)stuck++;else{stuck=0;last=s.i}
      if(stuck===4){var fs2=['goTo','go','ir','show','mostrar'];for(var k=0;k<fs2.length;k++){var f2=G(fs2[k]);if(typeof f2==='function'){try{f2(t)}catch(e){}var s4=state();if(s4&&s4.i===t){busy=false;upd();return}}}}
      var n=0;while(n<80){var s2=state();if(!s2||s2.i===t||(s2.i<0&&wait<12))break;if(s2.i<t)key('ArrowRight',39);else key('ArrowLeft',37);n++;var s3=state();if(s3&&s3.i===s2.i&&n>40)break}
      setTimeout(loop,stuck>2?250:30);
    })();
  }
  var ov=document.getElementById('irdOv'),box=document.getElementById('irdBox'),grid=document.getElementById('irdGrid'),inp=document.getElementById('irdIn'),lbl=document.getElementById('irdLbl'),btn=document.getElementById('irdBtn');
  btn.title=T.tip;document.getElementById('irdTxt').textContent=T.lab;document.getElementById('irdGo').textContent=T.go;document.getElementById('irdX').setAttribute('aria-label',T.x);document.getElementById('irdX').title=T.x;
  function upd(){var st=state();if(!st){btn.style.display='none';return}btn.style.display='';var t=(st.i+1)+' / '+st.n;if(lbl.textContent!==t)lbl.textContent=t}
  function place(){var r=btn.getBoundingClientRect();var l=Math.max(8,Math.min(r.left,innerWidth-box.offsetWidth-8));box.style.left=l+'px';box.style.bottom=Math.max(8,innerHeight-r.top+6)+'px'}
  function open(){var st=state();if(!st)return;grid.innerHTML='';var cur=null;
    for(var i=0;i<st.n;i++){(function(i){var b=document.createElement('button');b.type='button';if(i===st.i){b.className='cur';cur=b}b.innerHTML='<b>'+(i+1)+'</b><span></span>';var tt=title(st,i)||T.d+(i+1);b.querySelector('span').textContent=tt;b.title=(i+1)+'. '+tt;b.onclick=function(){close();setTimeout(function(){goTo(i)},30)};grid.appendChild(b)})(i)}
    inp.max=st.n;inp.value='';ov.classList.add('on');btn.classList.add('on');place();if(cur)cur.scrollIntoView({block:'center'});setTimeout(function(){inp.focus()},50);}
  function close(){ov.classList.remove('on');btn.classList.remove('on')}
  btn.onclick=function(e){e.stopPropagation();if(ov.classList.contains('on'))close();else open()};
  document.getElementById('irdX').onclick=close;
  ov.addEventListener('click',function(e){if(e.target===ov)close()});
  function goIn(){var v=parseInt(inp.value,10);if(v>0){close();setTimeout(function(){goTo(v-1)},30)}}
  document.getElementById('irdGo').onclick=goIn;
  window.addEventListener('keydown',function(e){if(!ov.classList.contains('on'))return;e.stopImmediatePropagation();if(e.key==='Escape')close();if(e.key==='Enter'&&e.target===inp)goIn()},true);
  window.addEventListener('resize',function(){if(ov.classList.contains('on'))place()});
  ['click','touchstart','touchend','mousedown','pointerdown','wheel'].forEach(function(t){ov.addEventListener(t,function(e){e.stopPropagation()},{passive:t==='wheel'||t==='touchstart'})});
  btn.addEventListener('touchstart',function(e){e.stopPropagation()},{passive:true});btn.addEventListener('touchend',function(e){e.stopPropagation()});
  window.irADiapositiva=function(n){goTo(n-1)};
  setInterval(upd,400);setTimeout(upd,300);
})();
</script>
