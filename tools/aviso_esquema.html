<!--avisoesq:inicio-->
<style>
#avEsq{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483500;display:none;align-items:center;gap:.6em;width:max-content;max-width:min(80vw,1250px);font:600 clamp(14px,1.4vw,27px)/1.25 system-ui,Arial,sans-serif;background:#fff8d6;color:#3a2d00;border:3px solid #f0c419;border-radius:999px;padding:.4em .5em .4em 1em;box-shadow:0 6px 22px rgba(0,0,0,.25);text-align:left}
#avEsq.on{display:flex;animation:avEsqIn .5s ease}
#avEsq button{font:inherit;font-weight:800;border:none;border-radius:999px;padding:.35em .9em;background:#1f6f8b;color:#fff;cursor:pointer;white-space:nowrap}
#avEsq button:hover{background:#d9483b}
#avEsq .x{background:transparent;color:#7a6200;padding:.2em .45em}
#avEsq .x:hover{background:#f0c419;color:#3a2d00}
@keyframes avEsqIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#avEsq.on{animation:none}}
@media print{#avEsq{display:none!important}}
</style>
<div id="avEsq" role="note"><span id="avEsqT"></span><button type="button" id="avEsqB"></button><button type="button" class="x" id="avEsqX" aria-label="Pechar">✕</button></div>
<script>
/* Aviso «vai ao esquema final». Configuración, antes deste bloque:
   window.AVISO_ESQUEMA={lingua:'gl'|'es', avisos:[{diapo:6, esquema:24, titulo:'Galicia na Idade Media'}, …]}
   diapo = última diapositiva dun bloque de teoría; esquema = diapositiva do esquema final con esa teoría (numeradas desde 1).
   Opcional: marxe:70 sobe o aviso 70 px (se a presentación ten unha barra propia abaixo).
   Se o aviso tapa contido, a diapositiva redúcese un pouco desde arriba mentres se ve o aviso.
   Necesita o bloque «Ir a diapositiva» (tools/ir_a_diapositiva.html), que debe ir antes. */
(function(){
  var C=window.AVISO_ESQUEMA||{},ES=(C.lingua||'gl')==='es',A=C.avisos||[];
  var av=document.getElementById('avEsq'),T=document.getElementById('avEsqT'),B=document.getElementById('avEsqB');
  var volta=null,destino=null,t0=0,pechado={};
  var ultimo=null;
  /* Conta os puntos do aviso que caen enriba de texto ou imaxes */
  function tapa(el){if(!el)return 0;var r=av.getBoundingClientRect(),c=0,x,y,L,e,i,k,t,q;av.style.visibility='hidden';
    for(i=1;i<=4;i++)for(k=1;k<=11;k++){x=r.left+r.width*k/12;y=r.top+r.height*i/5;L=document.elementsFromPoint(x,y);e=null;
      for(q=0;q<L.length;q++)if(L[q]!==el&&el.contains(L[q])){e=L[q];break}
      if(!e)continue;if(/^(IMG|VIDEO|CANVAS|IFRAME|svg|BUTTON|INPUT)$/i.test(e.tagName)||e.closest('svg')){c++;continue}
      for(t=e.firstChild;t;t=t.nextSibling)if(t.nodeType===3&&t.textContent.trim()){q=document.createRange();q.selectNodeContents(t);
        if([].some.call(q.getClientRects(),function(z){return x>=z.left&&x<=z.right&&y>=z.top&&y<=z.bottom})){c++;break}}}
    av.style.visibility='';return c}
  var SEL='.slide, .diapo, [data-slide], #stage > section',enc=null;
  function diapoActual(){var d=[].slice.call(document.querySelectorAll(SEL)).filter(function(e){return !e.closest('#irdOv')&&!(e.parentElement&&e.parentElement.closest(SEL))}),m=null,mv=0;
    d.forEach(function(e){var s=getComputedStyle(e);if(s.display==='none'||s.visibility==='hidden'||+s.opacity===0)return;var r=e.getBoundingClientRect();
      var v=Math.max(0,Math.min(r.right,innerWidth)-Math.max(r.left,0))*Math.max(0,Math.min(r.bottom,innerHeight)-Math.max(r.top,0));if(v>mv){mv=v;m=e}});return m}
  function restaura(){if(enc){enc.style.scale='';enc.style.transformOrigin='';enc=null}}
  /* Se o aviso tapa contido, reduce un pouco a diapositiva (desde arriba) ata deixarlle sitio */
  function mostra(id){if(ultimo!==id){ultimo=id;restaura();av.classList.add('on');if(C.marxe)av.style.bottom='calc('+C.marxe+'px + env(safe-area-inset-bottom,0px))'}encaixa()}
  function encaixa(){var el=enc||diapoActual();if(!el||!tapa(el))return;enc=el;el.style.transformOrigin='50% 0';
    for(var k=(+el.style.scale||1)-.03;k>=.79;k-=.03){el.style.scale=k.toFixed(2);if(!tapa(el))break}}
  function cur(){var l=document.getElementById('irdLbl');if(l){var m=(l.textContent||'').match(/(\d+)\s*\/\s*(\d+)/);if(m)return +m[1]}return 0}
  function ir(n){if(window.irADiapositiva)window.irADiapositiva(n)}
  function eEsquema(n){return A.some(function(x){return x.esquema===n})}
  function upd(){
    var n=cur(),a=null;
    if(destino){if(n===destino||Date.now()-t0>16000)destino=null;else{av.classList.remove('on');ultimo=null;restaura();return}}A.forEach(function(x){if(x.diapo===n)a=x});
    if(volta&&n!==volta&&!eEsquema(n))volta=null;
    if(a&&!pechado[n]){
      T.textContent='🗺️ '+(ES?'Esta teoría está resumida en el esquema final':'Esta teoría está resumida no esquema final')+(a.titulo?' «'+a.titulo+'»':'')+(ES?' (diapositiva ':' (diapositiva ')+a.esquema+').';
      B.textContent=ES?'Ir al esquema →':'Ir ao esquema →';
      B.onclick=function(){volta=n;destino=a.esquema;t0=Date.now();ir(a.esquema)};mostra(n);return}
    if(volta&&eEsquema(n)&&!pechado['v'+n]){
      T.textContent='';B.textContent='↩ '+(ES?'Volver a la diapositiva ':'Volver á diapositiva ')+volta;
      B.onclick=function(){var v=volta;volta=null;destino=v;t0=Date.now();ir(v)};mostra('v'+n);return}
    av.classList.remove('on');ultimo=null;restaura();
  }
  document.getElementById('avEsqX').onclick=function(){var n=cur();pechado[n]=1;pechado['v'+n]=1;av.classList.remove('on');ultimo=null;restaura()};
  ['click','touchstart','touchend','pointerdown','mousedown','keydown'].forEach(function(t){av.addEventListener(t,function(e){e.stopPropagation()})});
  window.avisoEsquema=upd;setInterval(upd,300);setTimeout(upd,200);
})();
</script>
<!--avisoesq:fin-->
