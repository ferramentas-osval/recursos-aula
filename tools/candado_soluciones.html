<!--candadoblq:inicio-->
<style>
#cdBtn{position:fixed;right:8px;bottom:8px;z-index:2147483600;width:30px;height:30px;padding:0;border:none;border-radius:50%;background:transparent;font-size:15px;line-height:30px;text-align:center;cursor:pointer;opacity:.25;transition:opacity .2s,background .2s}
#cdBtn:hover{opacity:.9}
#cdBtn.on{opacity:1;background:#2e7d32;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#cdBtn.lib{opacity:.25;background:transparent;box-shadow:none}
#cdBtn.lib:hover{opacity:.9}
#cdLibBtn{position:fixed;right:44px;bottom:8px;z-index:2147483600;height:30px;padding:0 10px;border:none;border-radius:999px;background:#1d4f91;color:#fff;font:600 12px/30px system-ui,Arial,sans-serif;cursor:pointer;opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;white-space:nowrap}
#cdLibBtn:hover{opacity:1}
#cdLibBtn.on{display:block}
#cdPop,#cdLibPop{position:fixed;right:8px;bottom:44px;z-index:2147483601;display:none;background:#fff;color:#222;border:1px solid #c9c9c9;border-radius:10px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font:14px/1.3 system-ui,Arial,sans-serif;text-align:left}
#cdPop.on,#cdLibPop.on{display:block}
#cdLibPop{max-width:min(300px,calc(100vw - 16px))}
#cdLibPop p{margin:0 0 8px}
#cdPop label{display:block;font-weight:700;margin-bottom:5px}
#cdPop .f,#cdLibPop .f{display:flex;gap:4px;align-items:center}
#cdIn{width:8.5em;font:inherit;padding:5px 7px;border:1px solid #999;border-radius:6px;color:#222;background:#fff}
#cdOjo,#cdOk,#cdLibSi,#cdLibNo{font:inherit;border:1px solid #999;background:#fff;color:#222;border-radius:6px;padding:5px 8px;cursor:pointer;line-height:1.1}
#cdOk,#cdLibSi{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:700}
#cdLibSi.oc{background:#b00020;border-color:#b00020}
#cdMsg,#cdLibMsg{color:#b00020;min-height:1em;font-size:12px;margin-top:4px}
#cdLibMsg.ok{color:#2e7d32}
#cdAviso{position:fixed;right:8px;bottom:46px;z-index:2147483602;background:#2e7d32;color:#fff;font:600 13px/1 system-ui,Arial,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
#cdAviso.on{opacity:1;transform:none}
[data-cd]:empty{display:none!important}
@media print{#cdBtn,#cdPop,#cdAviso,#cdLibBtn,#cdLibPop{display:none!important}}
</style>
<button id="cdBtn" type="button">🔒</button>
<button id="cdLibBtn" type="button"></button>
<div id="cdPop" role="dialog"><label for="cdIn" id="cdLab"></label><div class="f"><input id="cdIn" type="password" autocomplete="off"><button id="cdOjo" type="button">👁</button><button id="cdOk" type="button"></button></div><div id="cdMsg"></div></div>
<div id="cdLibPop" role="dialog"><p id="cdLibTxt"></p><div class="f"><button id="cdLibSi" type="button"></button><button id="cdLibNo" type="button"></button></div><div id="cdLibMsg"></div></div>
<div id="cdAviso"></div>
<script>
(function(){
  var C=window.CANDADO||{},GL=/^gl/i.test(document.documentElement.lang||'');
  var T=GL?{lab:'Código do profesor',ok:'Abrir',err:'Código incorrecto',av:'Solucións desbloqueadas',t1:'Solucións (profesor)',t2:'Volver bloquear',ojo:'Mostrar ou ocultar',
             lib:'🌐 Liberar para todos',oc:'🌐 Ocultar para todos',qlib:'Liberar as solucións deste recurso para todo o alumnado?',qoc:'Volver ocultar as solucións ao alumnado?',si:'Liberar',sio:'Ocultar',no:'Cancelar',env:'Enviando…',hecho:'✔ Feito. O alumnado verao nuns minutos.',fallo:'Non se puido: '}
           :{lab:'Código del profesor',ok:'Abrir',err:'Código incorrecto',av:'Soluciones desbloqueadas',t1:'Soluciones (profesor)',t2:'Volver a bloquear',ojo:'Mostrar u ocultar',
             lib:'🌐 Liberar para todos',oc:'🌐 Ocultar para todos',qlib:'¿Liberar las soluciones de este recurso para todo el alumnado?',qoc:'¿Volver a ocultar las soluciones al alumnado?',si:'Liberar',sio:'Ocultar',no:'Cancelar',env:'Enviando…',hecho:'✔ Hecho. El alumnado lo verá en unos minutos.',fallo:'No se ha podido: '};
  var $=function(i){return document.getElementById(i)};
  var B=document.body,btn=$('cdBtn'),pop=$('cdPop'),inp=$('cdIn'),msg=$('cdMsg'),av=$('cdAviso'),lb=$('cdLibBtn'),lp=$('cdLibPop'),lm=$('cdLibMsg');
  $('cdLab').textContent=T.lab;$('cdOk').textContent=T.ok;$('cdOjo').title=T.ojo;$('cdLibNo').textContent=T.no;
  if(C.ocultar){var st=document.createElement('style');st.textContent=C.ocultar.split(',').map(function(s){return 'body:not(.cd-abierto) '+s.trim()}).join(',')+'{display:none!important}'+(C.invisible?C.invisible.split(',').map(function(s){return 'body:not(.cd-abierto) '+s.trim()}).join(',')+'{visibility:hidden!important}':'');document.head.appendChild(st)}
  if(C.css){var s2=document.createElement('style');s2.textContent=C.css;document.head.appendChild(s2)}
  var D=null;try{var dj=$('cdDatos');if(dj)D=JSON.parse(dj.textContent)}catch(e){}
  var N=(D&&D.n)||150000,TE=new TextEncoder(),b64=function(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})};
  function derivar(code,exp){return crypto.subtle.importKey('raw',TE.encode(code),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:TE.encode('recursos-aula:'+C.id),iterations:N,hash:'SHA-256'},km,{name:'AES-GCM',length:256},!!exp,['decrypt'])})}
  function opn(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},k,b64(D.c)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
  function porClave(raw){return crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']).then(opn)}
  function claveB64(code){return derivar(code,true).then(function(k){return crypto.subtle.exportKey('raw',k)}).then(function(r){return btoa(String.fromCharCode.apply(null,new Uint8Array(r)))})}
  var abierto=false,lib=false,prof=null,SOL=null,URL_LIB=null;
  function poner(arr){SOL=arr;[].forEach.call(document.querySelectorAll('[data-cd]'),function(e){var k=+e.getAttribute('data-cd');if(arr&&arr[k]!=null)e.innerHTML=arr[k]});[].forEach.call(document.querySelectorAll('[data-cda]'),function(e){var v=e.getAttribute('data-cda').split(':');if(arr&&arr[+v[0]]!=null)e.setAttribute(v[1],arr[+v[0]])})}
  function quitar(){[].forEach.call(document.querySelectorAll('[data-cd]'),function(e){e.innerHTML=''});[].forEach.call(document.querySelectorAll('[data-cda]'),function(e){e.removeAttribute(e.getAttribute('data-cda').split(':')[1])})}
  function pinta(){btn.textContent=abierto?'🔓':'🔒';btn.classList.toggle('on',abierto&&!lib);btn.classList.toggle('lib',lib);btn.title=lib?T.t1:(abierto?T.t2:T.t1);
    lb.textContent=lib?T.oc:T.lib;lb.classList.toggle('on',!!(prof&&URL_LIB))}
  function estado(a,aviso){abierto=a;B.classList.toggle('cd-abierto',a);pinta();
    if(aviso){av.textContent='🔓 '+T.av;av.classList.add('on');clearTimeout(av._t);av._t=setTimeout(function(){av.classList.remove('on')},2200)}
    try{if(typeof C.alCambiar==='function')C.alCambiar(a)}catch(e){}}
  function comprobar(code){
    if(typeof C.abrir==='function')return Promise.resolve(C.abrir(code));
    if(D)return derivar(code).then(opn).then(poner);
    return Promise.reject(new Error('sin datos'));
  }
  function abrir(code,aviso){return comprobar(code).then(function(){prof=code;try{sessionStorage.setItem('cd:'+C.id,code)}catch(e){}estado(true,aviso&&!lib)})}
  function cerrar(){try{sessionStorage.removeItem('cd:'+C.id)}catch(e){}prof=null;cerrarLib();if(typeof C.cerrar==='function'){try{C.cerrar()}catch(e){}}else quitar();estado(false)}
  function cerrarPop(){pop.classList.remove('on');inp.value='';inp.type='password';msg.textContent=''}
  function cerrarLib(){lp.classList.remove('on');lm.textContent='';lm.className=''}
  function intentar(){var v=inp.value.trim();if(!v)return;msg.textContent='…';abrir(v,true).then(cerrarPop,function(){msg.textContent=T.err;inp.select()})}
  btn.onclick=function(e){e.stopPropagation();cerrarLib();
    if(lib&&prof)return;
    if(abierto&&!lib){cerrar();return}
    if(pop.classList.toggle('on')){msg.textContent='';setTimeout(function(){inp.focus()},30)}};
  lb.onclick=function(e){e.stopPropagation();cerrarPop();av.classList.remove('on');if(lp.classList.toggle('on')){$('cdLibTxt').textContent=lib?T.qoc:T.qlib;var si=$('cdLibSi');si.textContent=lib?T.sio:T.si;si.classList.toggle('oc',lib);si.disabled=false;lm.textContent='';lm.className=''}};
  $('cdLibNo').onclick=cerrarLib;
  $('cdLibSi').onclick=function(){
    var si=this,acc=lib?'ocultar':'liberar';si.disabled=true;lm.className='';lm.textContent=T.env;
    (acc==='liberar'?claveB64(prof):Promise.resolve('')).then(function(k){
      return fetch(URL_LIB,{method:'POST',body:JSON.stringify({accion:acc,id:C.id,clave:k,codigo:prof})}).then(function(r){return r.json()});
    }).then(function(r){
      if(!r||!r.ok)throw new Error(r&&r.error||'?');
      lib=(acc==='liberar');lm.className='ok';lm.textContent=T.hecho;pinta();setTimeout(cerrarLib,3500);
    }).catch(function(err){si.disabled=false;lm.className='';lm.textContent=T.fallo+(err&&err.message||err)});
  };
  $('cdOk').onclick=intentar;
  $('cdOjo').onclick=function(){inp.type=inp.type==='password'?'text':'password';inp.focus()};
  inp.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')intentar();if(e.key==='Escape')cerrarPop()});
  ['keyup','keypress'].forEach(function(t){inp.addEventListener(t,function(e){e.stopPropagation()})});
  document.addEventListener('click',function(e){if(!e.target.closest('#cdPop,#cdBtn,#cdLibPop,#cdLibBtn')){if(pop.classList.contains('on'))cerrarPop();if(lp.classList.contains('on'))cerrarLib()}},true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lp.classList.contains('on'))cerrarLib()});
  [pop,btn,lb,lp].forEach(function(el){['click','mousedown','pointerdown','touchstart','touchend'].forEach(function(t){el.addEventListener(t,function(e){e.stopPropagation()},{passive:t.indexOf('touch')===0})})});
  window.Candado={abierto:function(){return abierto},liberado:function(){return lib},soluciones:function(){return SOL}};
  /* sesión: si el profesor ya lo abrió en esta pestaña */
  try{var sp=sessionStorage.getItem('cd:'+C.id);if(sp)abrir(sp,false).catch(function(){})}catch(e){}
  /* configuración común y soluciones liberadas para todos (GitHub) */
  if(C.id){
    var BASE='https://ferramentas-osval.github.io/recursos-aula/assets/';
    fetch(BASE+'candado_config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.liberar_url){URL_LIB=j.liberar_url;pinta()}}).catch(function(){});
    fetch(BASE+'soluciones_liberadas.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var k=j[C.id];if(!k)return;
      var fin=function(){lib=true;estado(true)};
      if(typeof C.liberado==='function'){Promise.resolve(C.liberado(k)).then(fin).catch(function(){})}
      else if(D&&D.c&&k.length>8){porClave(k).then(function(a){poner(a);fin()}).catch(function(){})}
      else fin();
    }).catch(function(){});
  }
})();
</script>
<!--candadoblq:fin-->
