<!--candadoblq:inicio-->
<style>
#cdBtn{position:fixed;right:8px;bottom:8px;z-index:2147483600;width:30px;height:30px;padding:0;border:none;border-radius:50%;background:transparent;font-size:15px;line-height:30px;text-align:center;cursor:pointer;opacity:.25;transition:opacity .2s,background .2s}
#cdBtn:hover{opacity:.9}
#cdBtn.on{opacity:1;background:#2e7d32;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#cdBtn.lib{display:none}
#cdPop{position:fixed;right:8px;bottom:44px;z-index:2147483601;display:none;background:#fff;color:#222;border:1px solid #c9c9c9;border-radius:10px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font:14px/1.3 system-ui,Arial,sans-serif;text-align:left}
#cdPop.on{display:block}
#cdPop label{display:block;font-weight:700;margin-bottom:5px}
#cdPop .f{display:flex;gap:4px;align-items:center}
#cdIn{width:8.5em;font:inherit;padding:5px 7px;border:1px solid #999;border-radius:6px;color:#222;background:#fff}
#cdOjo,#cdOk{font:inherit;border:1px solid #999;background:#fff;color:#222;border-radius:6px;padding:5px 8px;cursor:pointer;line-height:1.1}
#cdOk{background:#2e7d32;border-color:#2e7d32;color:#fff;font-weight:700}
#cdMsg{color:#b00020;min-height:1em;font-size:12px;margin-top:4px}
#cdAviso{position:fixed;right:8px;bottom:46px;z-index:2147483602;background:#2e7d32;color:#fff;font:600 13px/1 system-ui,Arial,sans-serif;padding:8px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
#cdAviso.on{opacity:1;transform:none}
[data-cd]:empty{display:none!important}
@media print{#cdBtn,#cdPop,#cdAviso{display:none!important}}
</style>
<button id="cdBtn" type="button">🔒</button>
<div id="cdPop" role="dialog"><label for="cdIn" id="cdLab"></label><div class="f"><input id="cdIn" type="password" autocomplete="off"><button id="cdOjo" type="button">👁</button><button id="cdOk" type="button"></button></div><div id="cdMsg"></div></div>
<div id="cdAviso"></div>
<script>
(function(){
  var C=window.CANDADO||{},GL=/^gl/i.test(document.documentElement.lang||'');
  var T=GL?{lab:'Código do profesor',ok:'Abrir',err:'Código incorrecto',av:'Solucións desbloqueadas',t1:'Solucións (profesor)',t2:'Volver bloquear',ojo:'Mostrar ou ocultar'}
           :{lab:'Código del profesor',ok:'Abrir',err:'Código incorrecto',av:'Soluciones desbloqueadas',t1:'Soluciones (profesor)',t2:'Volver a bloquear',ojo:'Mostrar u ocultar'};
  var B=document.body,btn=document.getElementById('cdBtn'),pop=document.getElementById('cdPop'),inp=document.getElementById('cdIn'),msg=document.getElementById('cdMsg'),av=document.getElementById('cdAviso');
  document.getElementById('cdLab').textContent=T.lab;document.getElementById('cdOk').textContent=T.ok;document.getElementById('cdOjo').title=T.ojo;btn.title=T.t1;
  if(C.ocultar){var st=document.createElement('style');st.textContent=C.ocultar.split(',').map(function(s){return 'body:not(.cd-abierto) '+s.trim()}).join(',')+'{display:none!important}'+(C.invisible?C.invisible.split(',').map(function(s){return 'body:not(.cd-abierto) '+s.trim()}).join(',')+'{visibility:hidden!important}':'');document.head.appendChild(st)}
  if(C.css){var s2=document.createElement('style');s2.textContent=C.css;document.head.appendChild(s2)}
  var D=null;try{var dj=document.getElementById('cdDatos');if(dj)D=JSON.parse(dj.textContent)}catch(e){}
  var TE=new TextEncoder(),b64=function(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})};
  function opn(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},k,b64(D.c)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
  function porCodigo(code){return crypto.subtle.importKey('raw',TE.encode(code),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:TE.encode('recursos-aula:'+C.id),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}).then(opn)}
  function porClave(raw){return crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']).then(opn)}
  var abierto=false,SOL=null;
  function poner(arr){SOL=arr;[].forEach.call(document.querySelectorAll('[data-cd]'),function(e){var k=+e.getAttribute('data-cd');if(arr&&arr[k]!=null)e.innerHTML=arr[k]});[].forEach.call(document.querySelectorAll('[data-cda]'),function(e){var v=e.getAttribute('data-cda').split(':');if(arr&&arr[+v[0]]!=null)e.setAttribute(v[1],arr[+v[0]])})}
  function quitar(){[].forEach.call(document.querySelectorAll('[data-cd]'),function(e){e.innerHTML=''});[].forEach.call(document.querySelectorAll('[data-cda]'),function(e){e.removeAttribute(e.getAttribute('data-cda').split(':')[1])})}
  function estado(a,aviso){abierto=a;B.classList.toggle('cd-abierto',a);btn.textContent=a?'🔓':'🔒';btn.classList.toggle('on',a);btn.title=a?T.t2:T.t1;
    if(aviso){av.textContent='🔓 '+T.av;av.classList.add('on');clearTimeout(av._t);av._t=setTimeout(function(){av.classList.remove('on')},2200)}
    try{if(typeof C.alCambiar==='function')C.alCambiar(a)}catch(e){}}
  function comprobar(code){
    if(typeof C.abrir==='function')return Promise.resolve(C.abrir(code));
    if(D)return porCodigo(code).then(poner);
    return Promise.reject(new Error('sin datos'));
  }
  function abrir(code,aviso){return comprobar(code).then(function(){try{sessionStorage.setItem('cd:'+C.id,code)}catch(e){}estado(true,aviso)})}
  function cerrar(){try{sessionStorage.removeItem('cd:'+C.id)}catch(e){}if(typeof C.cerrar==='function'){try{C.cerrar()}catch(e){}}else quitar();estado(false)}
  function cerrarPop(){pop.classList.remove('on');inp.value='';inp.type='password';msg.textContent=''}
  function intentar(){var v=inp.value.trim();if(!v)return;msg.textContent='…';abrir(v,true).then(cerrarPop,function(){msg.textContent=T.err;inp.select()})}
  btn.onclick=function(e){e.stopPropagation();if(abierto){cerrar();return}if(pop.classList.toggle('on')){msg.textContent='';setTimeout(function(){inp.focus()},30)}};
  document.getElementById('cdOk').onclick=intentar;
  document.getElementById('cdOjo').onclick=function(){inp.type=inp.type==='password'?'text':'password';inp.focus()};
  inp.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')intentar();if(e.key==='Escape')cerrarPop()});
  ['keyup','keypress'].forEach(function(t){inp.addEventListener(t,function(e){e.stopPropagation()})});
  document.addEventListener('click',function(e){if(pop.classList.contains('on')&&!e.target.closest('#cdPop,#cdBtn'))cerrarPop()},true);
  ['click','mousedown','pointerdown','touchstart','touchend'].forEach(function(t){pop.addEventListener(t,function(e){e.stopPropagation()},{passive:t.indexOf('touch')===0});btn.addEventListener(t,function(e){e.stopPropagation()},{passive:t.indexOf('touch')===0})});
  window.Candado={abierto:function(){return abierto},soluciones:function(){return SOL},liberar:function(){btn.classList.add('lib');estado(true)}};
  /* sesión: si el profesor ya lo abrió en esta pestaña */
  try{var sp=sessionStorage.getItem('cd:'+C.id);if(sp)abrir(sp,false).catch(function(){})}catch(e){}
  /* soluciones liberadas para todos */
  if(C.id){
    fetch('https://ferramentas-osval.github.io/recursos-aula/assets/soluciones_liberadas.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var k=j[C.id];if(!k)return;
      if(typeof C.liberado==='function'){Promise.resolve(C.liberado(k)).then(function(){btn.classList.add('lib');estado(true)}).catch(function(){})}
      else if(D){porClave(k).then(function(a){poner(a);btn.classList.add('lib');estado(true)}).catch(function(){})}
      else{btn.classList.add('lib');estado(true)}
    }).catch(function(){});
  }
})();
</script>
<!--candadoblq:fin-->
